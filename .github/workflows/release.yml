name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ['v*', 'V*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag matching package.json, for example V1.0.2'
        required: true
        type: string
        default: 'V1.0.2'

permissions: {}

# Shared with pages.yml so a branch deployment and a release never overlap.
concurrency:
  group: pages-production
  queue: max
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Validate, test and package
    if: github.event.deleted != true && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate version and existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync } from 'node:fs';
          import { execFileSync, spawnSync } from 'node:child_process';
          const tag = process.env.RELEASE_TAG;
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          if (!/^[vV](0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag) || tag.slice(1) !== version) {
            throw new Error('Release tag must be v/V + package.json version.');
          }
          if (!existsSync(`docs/releases/${version}.md`)) throw new Error('Missing release notes.');
          const head = execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim();
          const existing = spawnSync('git', ['rev-parse', '--verify', `refs/tags/${tag}^{commit}`], {encoding:'utf8'});
          if (existing.status === 0 && existing.stdout.trim() !== head) throw new Error('Existing tag points to another commit; tags are never moved.');
          const releases = JSON.parse(execFileSync('gh', ['api', `repos/${process.env.GH_REPO}/releases`, '--paginate', '--slurp'], {encoding:'utf8'})).flat();
          if (releases.some(release => release.tag_name === tag)) throw new Error('A release already exists for this tag; it will not be overwritten.');
          console.log(`Preparing ${tag} from ${head}`);
          NODE
      - uses: pnpm/action-setup@v6
        with:
          version: '11.19.0'
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Package the same build for Release
        run: |
          mkdir -p release-assets
          cp "docs/releases/${RELEASE_TAG:1}.md" release-assets/RELEASE_NOTES.md
          cd dist
          zip -qr "../release-assets/OpenInterfaceMark-${RELEASE_TAG}-site.zip" .
          cd ../release-assets
          sha256sum "OpenInterfaceMark-${RELEASE_TAG}-site.zip" > SHA256SUMS.txt
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Publish version to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy tested build
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Publish GitHub Release
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets
      - name: Verify archive integrity
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt
      - name: Create and publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" \
            "release-assets/OpenInterfaceMark-${RELEASE_TAG}-site.zip" \
            release-assets/SHA256SUMS.txt \
            --target "$RELEASE_COMMIT" \
            --title "$RELEASE_TAG" \
            --notes-file release-assets/RELEASE_NOTES.md \
            --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
